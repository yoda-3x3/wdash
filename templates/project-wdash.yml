# Copy to <your project>/.github/workflows/wdash.yml on the project's base branch.
# Replace OWNER/wdash with your wdash repo. Secrets go in the PROJECT repo
# (Settings > Secrets and variables > Actions); see README "Cloud runs".
name: wdash

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: wdash job id
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: wdash-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  run:
    uses: OWNER/wdash/.github/workflows/wdash-run.yml@main
    with:
      job_id: ${{ inputs.job_id }}
      wdash_repo: OWNER/wdash
    secrets: inherit
