# Runs one wdash job on a GitHub Actions runner, for ANY project (SPEC.md §3).
# Dispatched by the website on this repo; it checks out the job's project repo itself, so project repos
# need no workflow or secrets of their own. Secrets live here, in the wdash repo:
#   CLAUDE_CODE_OAUTH_TOKEN, WDASH_REDIS_URL, WDASH_PROJECTS_TOKEN (Contents read/write on the project repos),
#   and optionally WDASH_VAPID_PUBLIC_KEY, WDASH_VAPID_PRIVATE_KEY, WDASH_WEB_URL, WDASH_VERCEL_TOKEN, WDASH_VERCEL_SCOPE.
# `wdash-daemon setup-cloud` sets them from the PC.
name: wdash-cloud

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: wdash job id
        required: true
        type: string
      repo:
        description: owner/name of the project repo (empty for a chat without a project)
        required: false
        type: string
        default: ""

concurrency:
  group: wdash-${{ inputs.job_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out wdash
        uses: actions/checkout@v4
        with:
          path: wdash

      - name: Check out project
        if: ${{ inputs.repo != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          token: ${{ secrets.WDASH_PROJECTS_TOKEN }}
          path: project
          fetch-depth: 0

      - name: Scratch folder (no project)
        if: ${{ inputs.repo == '' }}
        run: mkdir -p project

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wdash/package-lock.json

      - name: Build daemon
        working-directory: wdash
        run: |
          npm ci --workspace shared --workspace daemon --include-workspace-root
          npm run build -w shared
          npm run build -w daemon

      - name: Git identity
        run: |
          git config --global user.name "${{ github.repository_owner }}"
          # The owner's own noreply address, so GitHub and Vercel (Hobby blocks other authors) credit the account.
          git config --global user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"

      - name: Run job
        env:
          WDASH_REDIS_URL: ${{ secrets.WDASH_REDIS_URL }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.WDASH_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.WDASH_VAPID_PRIVATE_KEY }}
          WDASH_WEB_URL: ${{ secrets.WDASH_WEB_URL }}
          # Lets agents open and push other repos (open_repo / push_repo).
          WDASH_PROJECTS_TOKEN: ${{ secrets.WDASH_PROJECTS_TOKEN }}
          # Lets agents deploy with vercel_deploy (optional).
          VERCEL_TOKEN: ${{ secrets.WDASH_VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ secrets.WDASH_VERCEL_SCOPE }}
          WDASH_STATE_DIR: ${{ runner.temp }}/wdash
        run: node wdash/daemon/dist/main.js cloud --job "${{ inputs.job_id }}" --repo project
